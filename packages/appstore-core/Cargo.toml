[package]
name = "dkrypt-appstore-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
plist = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cookie_store = "0.21"
reqwest_cookie_store = "0.8"
url = "2"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
phf = { version = "0.11", features = ["macros"] }
mac_address = "1"
indicatif = "0.17"
sha2 = "0.10"
quick-xml = "0.37"
bzip2 = "0.6"
libloading = "0.8"
sevenz-rust2 = "0.22"
ruzstd = "0.9"
tar = "0.4"
getrandom = "0.3"
